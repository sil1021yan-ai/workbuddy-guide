name: Monitor Official Docs

on:
  schedule:
    # 每周一 01:00 UTC = 北京时间周一 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node monitor/check.mjs

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create monitor --description "官方文档变更监测" --color "0E8A16" || true
